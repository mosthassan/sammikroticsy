<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Ambient glow circle -->
  <circle cx="256" cy="256" r="180" fill="#0284c7" opacity="0.12" filter="url(#glow)" />

  <!-- Outer Concentric WiFi Wave -->
  <path d="M128 190 A180 180 0 0 1 384 190" fill="none" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" opacity="0.9" />
  
  <!-- Middle WiFi Wave -->
  <path d="M168 240 A124 124 0 0 1 344 240" fill="none" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" opacity="0.95" />

  <!-- Inner WiFi Wave -->
  <path d="M210 290 A66 66 0 0 1 302 290" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" />

  <!-- Center Hotspot Glowing Node -->
  <circle cx="256" cy="342" r="28" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="256" cy="342" r="14" fill="#ffffff" />

  <!-- Stylized MikroTik/Network Router Base Lines -->
  <rect x="176" y="396" width="160" height="24" rx="12" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="4" />
  <circle cx="216" cy="408" r="4" fill="#10b981" />
  <circle cx="240" cy="408" r="4" fill="#38bdf8" />
  <circle cx="264" cy="408" r="4" fill="#38bdf8" />
  <circle cx="296" cy="408" r="4" fill="#e2e8f0" />
</svg>
